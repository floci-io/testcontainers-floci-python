[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testcontainers-floci"
version = "0.3.0"
description = "Testcontainers module for Floci, the open-source local cloud emulators for AWS, Azure, GCP and OCI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["testcontainers", "floci", "aws", "azure", "gcp", "oci", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "testcontainers>=4.13.0",
]

[project.optional-dependencies]
# floci.oci generates a throwaway RSA signing key; the OCI SDK installs cryptography too.
oci = [
    "cryptography>=3.4",
]
dev = [
    "azure-storage-blob>=12.19",
    "azure-storage-queue>=12.9",
    "boto3>=1.34",
    "botocore>=1.34",
    "cryptography>=3.4",
    "google-cloud-storage>=2.14",
    "mypy>=1.0",
    "oci>=2.120",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/floci-io/testcontainers-floci-python"
Repository = "https://github.com/floci-io/testcontainers-floci-python"
Issues = "https://github.com/floci-io/testcontainers-floci-python/issues"
"Floci Project" = "https://github.com/floci-io/floci"

[tool.hatch.build.targets.wheel]
packages = ["floci"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require Docker (deselect with '-m not integration')",
]
