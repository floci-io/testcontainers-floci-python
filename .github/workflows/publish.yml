name: Publish to PyPI

on:
  release:
    types: [published]
  # Re-publish an existing release tag with the current workflow, for example after a failed
  # publish. The tagged source is built and published; the workflow file comes from the
  # branch the dispatch runs on.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example 0.2.0)"
        required: true
      testpypi:
        description: "Also publish to TestPyPI (for a pre-release tag)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publishing

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A dispatch input is resolved strictly as a tag: a branch name or SHA fails here.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tool
        run: pip install build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/testcontainers-floci
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no API token needed.
        # Configure trusted publishing at: https://pypi.org/manage/account/publishing/

  publish-testpypi:
    name: Publish to TestPyPI (pre-release)
    if: github.event.release.prerelease || inputs.testpypi
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/testcontainers-floci
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
