version: 2
updates:
  # Titles must be Conventional Commits: the pull-request title is checked by commit lint and becomes
  # the squash commit, which release-please reads.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # The dev tools live in the `dev` extra, which Dependabot can't tell from runtime dependencies, so
    # every update is a chore. Retitle a runtime bump (e.g. testcontainers) to fix(deps) before merging
    # so it reaches the changelog and cuts a release.
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tooling:
        patterns:
          - "boto3"
          - "botocore"
          - "mypy"
          - "pytest*"
          - "ruff"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
